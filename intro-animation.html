<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABHA â€” Royal Introduction</title>
  <link rel="icon" type="image/svg+xml" href="images/logo/abha-favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #FAF7F2; }

    @keyframes shimmerSweep {
      0% { transform: translateX(-150%) rotate(25deg); }
      100% { transform: translateX(250%) rotate(25deg); }
    }
    @keyframes haloPulse {
      0% { transform: scale(0.85); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes glintSparkle {
      0%, 80%, 100% { opacity: 0; transform: scale(0.5); }
      40% { opacity: 1; transform: scale(1.35); }
    }

    .shimmer-active {
      position: absolute;
      inset: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(243,215,139,0.12) 35%,
        rgba(255,245,214,0.5) 50%,
        rgba(243,215,139,0.12) 65%,
        rgba(255,255,255,0) 100%
      );
      animation: shimmerSweep 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
  </style>
</head>
<body class="relative w-screen h-screen select-none cursor-pointer" onclick="location.href='index.html'" ontouchstart="location.href='index.html'" style="touch-action: manipulation;" title="Tap anywhere to enter boutique">

  <!-- 1. Fullscreen Edge-to-Edge Artwork (Responsive: Mobile Portrait 9:16 & Desktop 16:9) -->
  <picture>
    <source media="(max-width: 768px), (max-aspect-ratio: 1/1)" srcset="images/logo/abha-logo-mobile-mockup.jpg">
    <img src="images/logo/abha-logo-primary-mockup.jpg" alt="ABHA Royal Introduction" class="w-full h-full object-cover object-center pointer-events-none" />
  </picture>

  <!-- 2. Dynamic Gold Shimmer Beam Overlay -->
  <div class="shimmer-active"></div>

  <!-- 3. Floating Gold Dust HTML5 Canvas -->
  <canvas id="fullscreenCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

  <!-- 4. Pulsing Halo Waves Centered over the Medallion -->
  <div class="absolute top-[47.6%] sm:top-[40%] left-[50%] -translate-x-1/2 -translate-y-1/2 pointer-events-none z-10">
    <div class="w-44 h-44 sm:w-72 sm:h-72 rounded-full border border-[#D4AF37]/50" style="animation: haloPulse 3.2s infinite ease-out;"></div>
    <div class="w-44 h-44 sm:w-72 sm:h-72 rounded-full border border-[#F3D78B]/40" style="animation: haloPulse 3.2s infinite ease-out 1.6s;"></div>
  </div>

  <!-- 5. Royal Sparkle Glints on Gold Accents -->
  <div class="absolute top-[42%] sm:top-[28%] left-[49%] pointer-events-none z-10" style="animation: glintSparkle 3s infinite ease-in-out 0.5s;">
    <svg class="w-5 h-5 sm:w-8 sm:h-8 text-[#FFF5D6] filter drop-shadow-[0_0_10px_#D4AF37]" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
    </svg>
  </div>
  <div class="absolute top-[52%] sm:top-[48%] left-[53%] pointer-events-none z-10" style="animation: glintSparkle 3.5s infinite ease-in-out 1.8s;">
    <svg class="w-4 h-4 sm:w-6 sm:h-6 text-[#FFF5D6] filter drop-shadow-[0_0_8px_#D4AF37]" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
    </svg>
  </div>

  <!-- Auto redirect to website after 2.8s (2-3s window) or click anywhere -->
  <script>
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 2800);
  </script>

  <script>
    // Fullscreen gold dust particle simulation
    const canvas = document.getElementById('fullscreenCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const count = 50;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 20;
        this.size = Math.random() * 2.2 + 0.8;
        this.speedY = Math.random() * 0.8 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.opacity = Math.random() * 0.7 + 0.2;
        this.rotation = Math.random() * 360;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.rotation += 1;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = "rgba(243, 215, 139, " + this.opacity + ")";
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#D4AF37';
        ctx.beginPath();
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size, 0);
        ctx.lineTo(0, this.size);
        ctx.lineTo(-this.size, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < count; i++) {
      const p = new Particle();
      p.y = Math.random() * canvas.height;
      particles.push(p);
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
