<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="45%" stop-color="#E2BA4B" />
      <stop offset="100%" stop-color="#B38728" />
    </linearGradient>
    <radialGradient id="favMaroon" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6E1624" />
      <stop offset="70%" stop-color="#4A101D" />
      <stop offset="100%" stop-color="#2D070E" />
    </radialGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#favMaroon)" stroke="url(#favGold)" stroke-width="3" />
  
  <!-- Outer Dotted Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#favGold)" stroke-width="1.6" stroke-dasharray="2 4" opacity="0.8" />
  
  <!-- Central Medallion Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#favGold)" stroke-width="2" />

  <!-- Monogram 'A' -->
  <g fill="url(#favGold)" stroke="url(#favGold)" stroke-width="0.5">
    <path d="M64,30 C65,31 66,34 68,37 L80,72 C82,77 86,81 92,83 C88,85 83,84 79,80 L74,70 L54,70 L49,80 C45,84 40,85 36,83 C42,81 46,77 48,72 L60,37 C62,34 63,31 64,30 Z" />
    <path d="M64,44 L58,63 L70,63 Z" fill="url(#favMaroon)" />
    <circle cx="64,28" r="2" fill="url(#favGold)" />
  </g>

  <!-- Blooming Lotus at Base of 'A' -->
  <g transform="translate(64, 76)">
    <path d="M0,-10 C3,-5 4,-2 0,3 C-4,-2 -3,-5 0,-10 Z" fill="url(#favGold)" />
    <path d="M0,3 C-4,2 -9,0 -9,-5 C-6,-5 -3,-2 0,1 Z" fill="url(#favGold)" opacity="0.9" />
    <path d="M0,3 C4,2 9,0 9,-5 C6,-5 3,-2 0,1 Z" fill="url(#favGold)" opacity="0.9" />
    <path d="M-11,3 C-5,8 5,8 11,3 C8,8 -8,8 -11,3 Z" fill="url(#favGold)" />
  </g>
</svg>