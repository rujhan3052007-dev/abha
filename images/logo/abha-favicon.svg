<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1D2F" />
      <stop offset="100%" stop-color="#340B14" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D279" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#favMaroon)" />
  
  <!-- Subtle Inset Gold Border -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="none" stroke="url(#favGold)" stroke-width="1.5" opacity="0.6" stroke-dasharray="3 3" />

  <!-- Central Lotus & 'A' Heritage Icon -->
  <g transform="translate(64, 62)">
    <!-- Central Halo -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#favGold)" stroke-width="1" opacity="0.4" />

    <!-- Blooming Center Petal -->
    <path d="M0,-30 C7,-18 9,-6 0,6 C-9,-6 -7,-18 0,-30 Z" fill="url(#favGold)" />
    <!-- Center Line -->
    <line x1="0" y1="-26" x2="0" y2="4" stroke="#4A101D" stroke-width="1.2" stroke-linecap="round" />

    <!-- Left Flanking Petal -->
    <path d="M0,4 C-9,2 -20,-4 -20,-16 C-15,-18 -6,-12 -2,-4 Z" fill="url(#favGold)" opacity="0.9" />
    <!-- Right Flanking Petal -->
    <path d="M0,4 C9,2 20,-4 20,-16 C15,-18 6,-12 2,-4 Z" fill="url(#favGold)" opacity="0.9" />

    <!-- Base Weave Crescent -->
    <path d="M-22,4 C-11,15 11,15 22,4 C16,18 -16,18 -22,4 Z" fill="url(#favGold)" />

    <!-- Subtle 'A' Monogram Footing -->
    <circle cx="0" cy="9" r="2.2" fill="#4A101D" />
    <path d="M0,18 C2,21 4,23 4,25 C4,27.2 2.2,29 0,29 C-2.2,29 -4,27.2 -4,25 C-4,23 -2,21 0,18 Z" fill="url(#favGold)" />
  </g>
</svg>
