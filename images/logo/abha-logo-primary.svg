<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Royal Antique Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D78B" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#B38728" />
      <stop offset="90%" stop-color="#8C651A" />
      <stop offset="100%" stop-color="#6B4B10" />
    </linearGradient>

    <!-- Warm Foil Specular Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="40%" stop-color="#E2BA4B" />
      <stop offset="100%" stop-color="#9C711D" />
    </linearGradient>

    <!-- Deep Imperial Maroon Gradient -->
    <radialGradient id="maroonDisc" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6E1624" />
      <stop offset="60%" stop-color="#4A101D" />
      <stop offset="100%" stop-color="#2D070E" />
    </radialGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Playfair+Display:wght@700&amp;family=Montserrat:wght@600;700&amp;display=swap');
    
    .primary-title {
      font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 52px;
      letter-spacing: 0.18em;
      fill: #4A101D;
    }
    .primary-subtext {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.38em;
      fill: #8C651A;
      text-transform: uppercase;
    }
  </style>

  <!-- ==================== LEFT EMBLEM MEDALLION ==================== -->
  <g transform="translate(62, 60)" filter="url(#subtleGlow)">
    <!-- Outer Finials (North, South, East, West) -->
    <g fill="url(#goldGrad)">
      <path d="M0,-54 C-1.5,-50 -4,-48 -5,-48 C-3,-46 -1.5,-46 0,-45 C1.5,-46 3,-46 5,-48 C4,-48 1.5,-50 0,-54 Z" />
      <circle cx="0" cy="-55" r="1.2" />
      <path d="M0,54 C-1.5,50 -4,48 -5,48 C-3,46 -1.5,46 0,45 C1.5,46 3,46 5,48 C4,48 1.5,50 0,54 Z" />
      <circle cx="0" cy="55" r="1.2" />
      <path d="M54,0 C50,-1.5 48,-4 48,-5 C46,-3 46,-1.5 45,0 C46,1.5 46,3 48,5 C48,4 50,1.5 54,0 Z" />
      <circle cx="55" cy="0" r="1.2" />
      <path d="M-54,0 C-50,-1.5 -48,-4 -48,-5 C-46,-3 -46,-1.5 -45,0 C-46,1.5 -46,3 -48,5 C-48,4 -50,1.5 -54,0 Z" />
      <circle cx="-55" cy="0" r="1.2" />

      <!-- Diagonal accent beads -->
      <g transform="rotate(45)">
        <circle cx="0" cy="-49" r="1.4" />
        <circle cx="0" cy="49" r="1.4" />
        <circle cx="-49" cy="0" r="1.4" />
        <circle cx="49" cy="0" r="1.4" />
      </g>
    </g>

    <!-- Outer Gold Ring & Beaded Rim -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.9" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 3.5" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#goldHighlight)" stroke-width="1.2" />

    <!-- Maroon Disc Base -->
    <circle cx="0" cy="0" r="39" fill="url(#maroonDisc)" stroke="url(#goldGrad)" stroke-width="0.8" />

    <!-- Arabesque Zari Petals Inside Maroon Disc -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.85">
      <path d="M-8,-16 C-16,-14 -24,-8 -24,0 C-24,8 -16,14 -10,15" />
      <path d="M8,-16 C16,-14 24,-8 24,0 C24,8 16,14 10,15" />
      <circle cx="-16" cy="-8" r="0.9" fill="url(#goldGrad)" />
      <circle cx="16" cy="-8" r="0.9" fill="url(#goldGrad)" />
    </g>

    <!-- Monogram 'A' -->
    <g fill="url(#goldHighlight)" stroke="url(#goldGrad)" stroke-width="0.4">
      <path d="M0,-26 C1,-25 2,-23 3,-21 L13,5 C15,9 18,12 23,14 C20,15 16,14 13,11 L9,2 L-9,2 L-13,11 C-16,14 -20,15 -23,14 C-18,12 -15,9 -13,5 L-3,-21 C-2,-23 -1,-25 0,-26 Z" />
      <path d="M0,-16 L-5,-2 L5,-2 Z" fill="url(#maroonDisc)" />
      <circle cx="0" cy="-27" r="1.2" fill="url(#goldHighlight)" />
    </g>

    <!-- Base Blooming Lotus -->
    <g transform="translate(0, 9)">
      <path d="M0,-7 C2,-4 3,-1 0,2 C-3,-1 -2,-4 0,-7 Z" fill="url(#goldHighlight)" />
      <path d="M0,2 C-3,1 -6,-1 -6,-4 C-4,-4 -2,-2 0,0 Z" fill="url(#goldGrad)" />
      <path d="M0,2 C3,1 6,-1 6,-4 C4,-4 2,-2 0,0 Z" fill="url(#goldGrad)" />
      <path d="M-7,2 C-3,5 3,5 7,2 C5,5 -5,5 -7,2 Z" fill="url(#goldHighlight)" />
    </g>
  </g>

  <!-- ==================== RIGHT TYPOGRAPHY ==================== -->
  <g transform="translate(136, 0)">
    <!-- Main Brand Name: ABHA -->
    <text x="0" y="58" class="primary-title">ABHA</text>

    <!-- Decorative Divider Line with Diamond Center -->
    <line x1="2" y1="72" x2="385" y2="72" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.8" />
    <polygon points="193,68 197,72 193,76 189,72" fill="url(#goldGrad)" />
    <circle cx="150" cy="72" r="1.4" fill="url(#goldGrad)" />
    <circle cx="236" cy="72" r="1.4" fill="url(#goldGrad)" />

    <!-- Subtitle / Tagline: • CLOTHING & TAILORING • -->
    <text x="3" y="93" class="primary-subtext">
      <tspan fill="url(#goldGrad)">&#8226;</tspan>
      &nbsp; CLOTHING &amp; TAILORING &nbsp;
      <tspan fill="url(#goldGrad)">&#8226;</tspan>
    </text>
  </g>
</svg>