<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Linear Gradient -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="100%" stop-color="#8C651A" />
    </linearGradient>
    <!-- Deep Maroon Gradient -->
    <linearGradient id="deepMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1D2F" />
      <stop offset="100%" stop-color="#4A101D" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
    .brand-title {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 52px;
      letter-spacing: 0.16em;
      fill: #4A101D;
    }
    .brand-subtext {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.38em;
      fill: #8C3A27;
      text-transform: uppercase;
    }
  </style>

  <g transform="translate(10, 10)">
    <!-- ==================== LOTUS WEAVE MOTIF (LEFT EMBLEM) ==================== -->
    <g transform="translate(15, 10)">
      <!-- Outer Decorative Halo Rings -->
      <circle cx="40" cy="40" r="38" fill="none" stroke="url(#royalGold)" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="2 3" />
      <circle cx="40" cy="40" r="34" fill="#FAF7F2" stroke="url(#royalGold)" stroke-width="1.6" />

      <!-- Indian Heritage Lotus Petals & Textile Weave Lines -->
      <!-- Center Main Petal (Rising Bloom) -->
      <path d="M40,16 C46,26 48,36 40,48 C32,36 34,26 40,16 Z" fill="url(#deepMaroon)" />
      <!-- Central Zari Vein -->
      <path d="M40,18 L40,46" stroke="url(#royalGold)" stroke-width="1.2" stroke-linecap="round" />

      <!-- Left Flanking Petals -->
      <path d="M40,46 C32,44 23,38 23,28 C28,26 36,32 39,40 Z" fill="url(#royalGold)" fill-opacity="0.9" />
      <path d="M39,46 C29,48 20,44 18,36 C22,33 32,37 38,44 Z" fill="url(#deepMaroon)" fill-opacity="0.85" />

      <!-- Right Flanking Petals -->
      <path d="M40,46 C48,44 57,38 57,28 C52,26 44,32 41,40 Z" fill="url(#royalGold)" fill-opacity="0.9" />
      <path d="M41,46 C51,48 60,44 62,36 C58,33 48,37 42,44 Z" fill="url(#deepMaroon)" fill-opacity="0.85" />

      <!-- Lower Handloom Calyx / Weave Base (Textile Spindle Curve) -->
      <path d="M22,46 C32,54 48,54 58,46 C52,58 28,58 22,46 Z" fill="url(#royalGold)" />
      
      <!-- Central Tailoring Needle Eye Accent -->
      <circle cx="40" cy="49" r="1.8" fill="#FAF7F2" />

      <!-- Heritage Base Droplet / Kundan Accent -->
      <path d="M40,58 C42,61 44,63 44,65 C44,67.2 42.2,69 40,69 C37.8,69 36,67.2 36,65 C36,63 38,61 40,58 Z" fill="url(#deepMaroon)" />
    </g>

    <!-- ==================== TYPOGRAPHY & WORDMARK ==================== -->
    <g transform="translate(125, 0)">
      <!-- Main Brand Name: ABHA -->
      <text x="0" y="58" class="brand-title">ABHA</text>

      <!-- Decorative Divider with Gold Diamond Motif -->
      <line x1="2" y1="72" x2="360" y2="72" stroke="url(#royalGold)" stroke-width="1.2" stroke-opacity="0.7" />
      
      <!-- Heritage Diamond Centerpiece on Divider -->
      <polygon points="181,68 185,72 181,76 177,72" fill="url(#royalGold)" />
      <circle cx="140" cy="72" r="1.5" fill="url(#royalGold)" />
      <circle cx="222" cy="72" r="1.5" fill="url(#royalGold)" />

      <!-- Subtitle / Tagline: CLOTHING & TAILORING -->
      <text x="3" y="91" class="brand-subtext">CLOTHING &amp; TAILORING</text>
    </g>
  </g>
</svg>
