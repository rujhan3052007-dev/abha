<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Royal Antique Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D78B" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#B38728" />
      <stop offset="90%" stop-color="#8C651A" />
      <stop offset="100%" stop-color="#6B4B10" />
    </linearGradient>

    <!-- Warm Foil Specular Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="40%" stop-color="#E2BA4B" />
      <stop offset="100%" stop-color="#9C711D" />
    </linearGradient>

    <!-- Deep Imperial Maroon Gradient -->
    <radialGradient id="maroonDisc" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6E1624" />
      <stop offset="60%" stop-color="#4A101D" />
      <stop offset="100%" stop-color="#2D070E" />
    </radialGradient>

    <!-- Drop Shadow Filter for Vector Emboss Feel -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Playfair+Display:ital,wght@0,600;0,700&amp;family=Montserrat:wght@500;600;700&amp;display=swap');
    
    .brand-heading {
      font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 66px;
      letter-spacing: 0.22em;
      fill: url(#goldHighlight);
      text-anchor: middle;
    }
    .brand-tagline {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 0.36em;
      fill: url(#goldGrad);
      text-anchor: middle;
      text-transform: uppercase;
    }
  </style>

  <!-- ==================== CENTRAL ROYAL MEDALLION ==================== -->
  <g transform="translate(250, 185)" filter="url(#subtleShadow)">
    
    <!-- 1. Outer Cardinal & Diagonal Botanical Finials / Florets -->
    <g fill="url(#goldGrad)">
      <!-- North Finial -->
      <path d="M0,-146 C-3,-136 -10,-130 -14,-130 C-9,-125 -4,-125 0,-122 C4,-125 9,-125 14,-130 C10,-130 3,-136 0,-146 Z" />
      <circle cx="0" cy="-149" r="2.5" />
      <!-- South Finial -->
      <path d="M0,146 C-3,136 -10,130 -14,130 C-9,125 -4,125 0,122 C4,125 9,125 14,130 C10,130 3,136 0,146 Z" />
      <circle cx="0" cy="149" r="2.5" />
      <!-- East Finial -->
      <path d="M146,0 C136,-3 130,-10 130,-14 C125,-9 125,-4 122,0 C125,4 125,9 130,14 C130,10 136,3 146,0 Z" />
      <circle cx="149" cy="0" r="2.5" />
      <!-- West Finial -->
      <path d="M-146,0 C-136,-3 -130,-10 -130,-14 C-125,-9 -125,-4 -122,0 C-125,4 -125,9 -130,14 C-130,10 -136,3 -146,0 Z" />
      <circle cx="-149" cy="0" r="2.5" />

      <!-- 4 Diagonal Sprigs (NW, NE, SE, SW) -->
      <g transform="rotate(45)">
        <circle cx="0" cy="-133" r="3.2" />
        <circle cx="0" cy="133" r="3.2" />
        <circle cx="-133" cy="0" r="3.2" />
        <circle cx="133" cy="0" r="3.2" />
      </g>
    </g>

    <!-- 2. Outer Delicate Ring & Beads -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.85" />
    
    <!-- Outer Bead Ring (60 beads) -->
    <circle cx="0" cy="0" r="124" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1.5 6.4" />

    <!-- 3. Inner Decorative Rings -->
    <circle cx="0" cy="0" r="116" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="0" cy="0" r="112" fill="none" stroke="url(#goldHighlight)" stroke-width="2.5" />
    
    <!-- Scalloped Inner Lip Ring -->
    <circle cx="0" cy="0" r="107" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3" />

    <!-- 4. Deep Imperial Maroon Central Disc -->
    <circle cx="0" cy="0" r="104" fill="url(#maroonDisc)" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- 5. Ornamental Arabesque Filigree & Lotus Jali Weave (Behind & Around 'A') -->
    <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M0,-95 C18,-85 38,-80 48,-62 C58,-44 65,-20 62,0 C59,20 54,42 40,58 C26,74 12,85 0,94 C-12,85 -26,74 -40,58 C-54,42 -59,20 -62,0 C-65,-20 -58,-44 -48,-62 C-38,-80 -18,-85 0,-95 Z" stroke-width="1.4" opacity="0.6" />
      
      <!-- Left Swirls -->
      <path d="M-18,-45 C-36,-40 -56,-24 -56,0 C-56,22 -38,36 -24,38" stroke-width="1.8" />
      <path d="M-36,-20 C-46,-12 -46,10 -34,16 C-22,22 -14,14 -12,4" stroke-width="1.4" />
      <path d="M-50,0 C-68,4 -78,-16 -64,-34 C-50,-52 -28,-64 0,-76" stroke-width="1.5" />
      <circle cx="-38" cy="-28" r="2" fill="url(#goldGrad)" />
      <circle cx="-52" cy="18" r="2.2" fill="url(#goldGrad)" />

      <!-- Right Swirls -->
      <path d="M18,-45 C36,-40 56,-24 56,0 C56,22 38,36 24,38" stroke-width="1.8" />
      <path d="M36,-20 C46,-12 46,10 34,16 C22,22 14,14 12,4" stroke-width="1.4" />
      <path d="M50,0 C68,4 78,-16 64,-34 C50,-52 28,-64 0,-76" stroke-width="1.5" />
      <circle cx="38" cy="-28" r="2" fill="url(#goldGrad)" />
      <circle cx="52" cy="18" r="2.2" fill="url(#goldGrad)" />
    </g>

    <!-- 6. THE CENTRAL GILDED ROYAL MONOGRAM 'A' -->
    <g fill="url(#goldHighlight)" stroke="url(#goldGrad)" stroke-width="0.8">
      <path d="M0,-66 C2,-64 5,-60 8,-54 L34,12 C38,22 46,30 58,34 C52,38 42,36 34,28 L24,5 L-24,5 L-34,28 C-42,36 -52,38 -58,34 C-46,30 -38,22 -34,12 L-8,-54 C-5,-60 -2,-64 0,-66 Z" />
      <path d="M0,-42 L-14, -6 L14, -6 Z" fill="url(#maroonDisc)" stroke="url(#goldGrad)" stroke-width="1.4" />
      <path d="M-22,-4 C-10,-9 10,-9 22,-4 C16,0 -16,0 -22,-4 Z" fill="url(#goldHighlight)" />
      <circle cx="0" cy="-68" r="3.2" fill="url(#goldHighlight)" />
      <path d="M0,-72 L3,-67 L-3,-67 Z" fill="url(#goldHighlight)" />
    </g>

    <!-- 7. BLOOMING GOLD LOTUS AT THE BASE OF 'A' -->
    <g transform="translate(0, 24)">
      <path d="M0,-18 C5,-10 7,-2 0,6 C-7,-2 -5,-10 0,-18 Z" fill="url(#goldHighlight)" stroke="url(#goldGrad)" stroke-width="0.8" />
      <line x1="0" y1="-16" x2="0" y2="4" stroke="#6E1624" stroke-width="0.8" />
      <path d="M0,5 C-6,3 -14,-2 -15,-10 C-10,-11 -4,-6 0,-1 Z" fill="url(#goldGrad)" stroke="url(#goldHighlight)" stroke-width="0.6" />
      <path d="M-2,6 C-10,6 -22,2 -24,-5 C-18,-8 -10,-4 -3,2 Z" fill="url(#goldHighlight)" opacity="0.9" />
      <path d="M0,5 C6,3 14,-2 15,-10 C10,-11 4,-6 0,-1 Z" fill="url(#goldGrad)" stroke="url(#goldHighlight)" stroke-width="0.6" />
      <path d="M2,6 C10,6 22,2 24,-5 C18,-8 10,-4 3,2 Z" fill="url(#goldHighlight)" opacity="0.9" />
      <path d="M-18,6 C-8,14 8,14 18,6 C12,14 -12,14 -18,6 Z" fill="url(#goldGrad)" />
      <circle cx="0" cy="11" r="1.8" fill="url(#goldHighlight)" />
    </g>
  </g>

  <!-- ==================== BRAND NAME & SUBTEXT ==================== -->
  <text x="250" y="392" class="brand-heading" filter="url(#subtleShadow)">ABHA</text>
  <text x="250" y="428" class="brand-tagline">
    <tspan fill="url(#goldGrad)">&#8226;</tspan>
    &nbsp; CLOTHING &amp; TAILORING &nbsp;
    <tspan fill="url(#goldGrad)">&#8226;</tspan>
  </text>
</svg>