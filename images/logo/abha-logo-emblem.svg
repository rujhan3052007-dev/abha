<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D279" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B38728" />
      <stop offset="100%" stop-color="#8C651A" />
    </linearGradient>

    <!-- Deep Regal Maroon Gradient -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1D2F" />
      <stop offset="60%" stop-color="#4A101D" />
      <stop offset="100%" stop-color="#340B14" />
    </linearGradient>

    <!-- Subtle Radial Glow for Emblem Background -->
    <radialGradient id="emblemBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="75%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F3ECE1" />
    </radialGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
    .emblem-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 56px;
      letter-spacing: 0.22em;
      fill: #4A101D;
      text-anchor: middle;
    }
    .emblem-subtext {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: 0.36em;
      fill: #8C3A27;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .emblem-tagline {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 500;
      font-size: 9px;
      letter-spacing: 0.28em;
      fill: #B38728;
      text-anchor: middle;
      text-transform: uppercase;
    }
  </style>

  <!-- ==================== BACKGROUND & ORNATE BORDERS ==================== -->
  <!-- Base Outer Circle -->
  <circle cx="250" cy="250" r="236" fill="url(#emblemBg)" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Dotted Jharokha Ring -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="3 4" opacity="0.8" />

  <!-- Inner Concentric Frame Ring -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#6B1D2F" stroke-width="1.2" opacity="0.6" />
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5" />

  <!-- 8 Cardinal Direction Heritage Sunburst Accents -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="250" y1="18" x2="250" y2="28" />
    <line x1="250" y1="472" x2="250" y2="482" />
    <line x1="18" y1="250" x2="28" y2="250" />
    <line x1="472" y1="250" x2="482" y2="250" />
  </g>

  <!-- ==================== CENTRAL ROYAL LOTUS WEAVE MOTIF ==================== -->
  <g transform="translate(250, 160)">
    <!-- Central Halo Circle behind Lotus -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Blooming Lotus Petals -->
    <!-- Main Center Blooming Petal -->
    <path d="M0,-52 C12,-32 15,-12 0,8 C-15,-12 -12,-32 0,-52 Z" fill="url(#maroonGrad)" />
    <!-- Gold Center Vein (Zari Thread) -->
    <line x1="0" y1="-48" x2="0" y2="4" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round" />

    <!-- Left Inner Petal -->
    <path d="M0,4 C-15,0 -32,-10 -32,-28 C-24,-31 -10,-20 -4,-6 Z" fill="url(#goldGrad)" />
    <!-- Left Outer Petal -->
    <path d="M-3,4 C-18,6 -44,0 -48,-14 C-40,-20 -24,-13 -12,0 Z" fill="url(#maroonGrad)" opacity="0.9" />

    <!-- Right Inner Petal -->
    <path d="M0,4 C15,0 32,-10 32,-28 C24,-31 10,-20 4,-6 Z" fill="url(#goldGrad)" />
    <!-- Right Outer Petal -->
    <path d="M3,4 C18,6 44,0 48,-14 C40,-20 24,-13 12,0 Z" fill="url(#maroonGrad)" opacity="0.9" />

    <!-- Handloom Weave Base (Crescent Foundation) -->
    <path d="M-36,6 C-18,22 18,22 36,6 C26,28 -26,28 -36,6 Z" fill="url(#goldGrad)" />

    <!-- Fine Tailoring Needle Detail -->
    <circle cx="0" cy="14" r="3" fill="#FFFDF9" stroke="url(#goldGrad)" stroke-width="1.2" />

    <!-- Hanging Heritage Kundan Droplet -->
    <path d="M0,28 C3,33 6,36 6,40 C6,43.3 3.3,46 0,46 C-3.3,46 -6,43.3 -6,40 C-6,36 -3,33 0,28 Z" fill="url(#maroonGrad)" />
    <circle cx="0" cy="40" r="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- ==================== BRAND NAME & TYPOGRAPHY ==================== -->
  <!-- Top Decorative Stars -->
  <text x="250" y="278" class="emblem-tagline">✦ &nbsp; HERITAGE HANDLOOMS &nbsp; ✦</text>

  <!-- Main Wordmark: ABHA -->
  <text x="250" y="340" class="emblem-title">ABHA</text>

  <!-- Decorative Divider with Diamond Crest -->
  <g transform="translate(140, 360)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="url(#goldGrad)" stroke-width="1.4" opacity="0.8" />
    <polygon points="110,-4 114,0 110,4 106,0" fill="url(#goldGrad)" />
    <circle cx="70" cy="0" r="2" fill="url(#goldGrad)" />
    <circle cx="150" cy="0" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Subtitle: CLOTHING & TAILORING -->
  <text x="250" y="388" class="emblem-subtext">CLOTHING &amp; TAILORING</text>

  <!-- Bottom Craft Tagline / Year Stamp -->
  <text x="250" y="420" class="emblem-tagline">BEAWAR • RAJASTHAN • ESTD 2026</text>
</svg>
